version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: livetracking-postgres
    environment:
      POSTGRES_DB: livetracking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - livetracking

  backend:
    build:
      context: .
      dockerfile: backend/LiveTracking.Api/Dockerfile
    container_name: livetracking-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=livetracking;Username=postgres;Password=postgres
      - ASPNETCORE_URLS=http://+:8080
      - Jwt__Secret=your-super-secret-jwt-key-min-32-chars-long-12345678
      - Jwt__Issuer=VeloPulse
      - Jwt__Audience=VeloPulse
      - Jwt__ExpirationMinutes=60
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - livetracking

  frontend:
    build:
      context: ./apps/public_web
      dockerfile: Dockerfile.prod
      args:
        - VITE_API_URL=http://localhost:8080
        - VITE_SIGNALR_HUB_URL=http://localhost:8080/hubs/live-tracking
    container_name: livetracking-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - livetracking

volumes:
  postgres_data:

networks:
  livetracking:
    driver: bridge
