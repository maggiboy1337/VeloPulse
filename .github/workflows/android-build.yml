name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'apps/public_web/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: # Manual trigger

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/public_web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: apps/public_web
        run: npm ci

      - name: Build web assets
        working-directory: apps/public_web
        run: npm run build

      - name: Sync Capacitor
        working-directory: apps/public_web
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: apps/public_web/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: apps/public_web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign APK (optional, unsigned for now)
        working-directory: apps/public_web/android
        run: |
          echo "APK built successfully"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velopulse-debug-apk
          path: apps/public_web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apps/public_web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
