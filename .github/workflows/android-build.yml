name: Build Android APK (Native Foreground Service)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/public_web/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: # Manual trigger
    inputs:
      version:
        description: 'Build version tag'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/public_web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: apps/public_web
        run: npm ci

      - name: Build web assets
        working-directory: apps/public_web
        env:
          VITE_API_URL: https://www.velopulse.de
          VITE_SIGNALR_HUB_URL: https://www.velopulse.de/hubs/live-tracking
          VITE_TILE_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
          VITE_TILE_ATTRIBUTION: © OpenStreetMap contributors
        run: npm run build

      - name: Sync Capacitor
        working-directory: apps/public_web
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: apps/public_web/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: apps/public_web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign APK (optional, unsigned for now)
        working-directory: apps/public_web/android
        run: |
          echo "APK built successfully"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velopulse-native-foreground-${{ github.sha }}
          path: apps/public_web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "✅ APK Build erfolgreich!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Native Android Foreground Service Implementation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Features in diesem Build:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Native Foreground Service** (Kotlin)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **GPS mit Fused Location Provider API**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Native HTTP Uploads im Hintergrund**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Permanente Notification**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **WakeLock für gesperrtes Display**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Offline-Queue mit Retry**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Android 12+ konform**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ **Funktioniert wie Strava/Komoot**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Download:" >> $GITHUB_STEP_SUMMARY
          echo "APK: \`velopulse-native-foreground-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Testing:" >> $GITHUB_STEP_SUMMARY
          echo "1. \`adb install app-debug.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "2. Berechtigungen erteilen (Standort + Hintergrund)" >> $GITHUB_STEP_SUMMARY
          echo "3. Tracking starten" >> $GITHUB_STEP_SUMMARY
          echo "4. Display sperren" >> $GITHUB_STEP_SUMMARY
          echo "5. Logcat: \`adb logcat | grep TrackingService\`" >> $GITHUB_STEP_SUMMARY
          echo "6. Erwartung: Kontinuierliche GPS-Updates auch bei gesperrtem Display" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### Dokumentation:" >> $GITHUB_STEP_SUMMARY
          echo "- Setup: \`docs/SETUP_NATIVE_TRACKING.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- Details: \`docs/NATIVE_TRACKING_SERVICE.md\`" >> $GITHUB_STEP_SUMMARY
          echo "- Summary: \`docs/IMPLEMENTATION_SUMMARY.md\`" >> $GITHUB_STEP_SUMMARY
      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apps/public_web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
