name: Build Android APK (Event-Based GPS)

on:
  push:
    branches:
      - main
    paths:
      - 'apps/public_web/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch: # Manual trigger
    inputs:
      version:
        description: 'Build version tag'
        required: false
        default: 'latest'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: apps/public_web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: apps/public_web
        run: npm ci

      - name: Build web assets
        working-directory: apps/public_web
        env:
          VITE_API_URL: https://www.velopulse.de
          VITE_SIGNALR_HUB_URL: https://www.velopulse.de/hubs/live-tracking
          VITE_TILE_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
          VITE_TILE_ATTRIBUTION: © OpenStreetMap contributors
        run: npm run build

      - name: Sync Capacitor
        working-directory: apps/public_web
        run: npx cap sync android

      - name: Grant execute permission for gradlew
        working-directory: apps/public_web/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: apps/public_web/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Sign APK (optional, unsigned for now)
        working-directory: apps/public_web/android
        run: |
          echo "APK built successfully"
          ls -la app/build/outputs/apk/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: velopulse-event-based-gps-${{ github.sha }}
          path: apps/public_web/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build Summary
        if: success()
        run: |
          echo "✅ APK Build erfolgreich!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Features in diesem Build:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Event-Based GPS Upload (5s throttle)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Background HTTP (Capacitor HTTP)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ WakeLock in MainActivity" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Works with locked display" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download:" >> $GITHUB_STEP_SUMMARY
          echo "APK: \`velopulse-event-based-gps-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Testing:" >> $GITHUB_STEP_SUMMARY
          echo "1. Install APK on device" >> $GITHUB_STEP_SUMMARY
          echo "2. Start tracking" >> $GITHUB_STEP_SUMMARY
          echo "3. Lock display" >> $GITHUB_STEP_SUMMARY
          echo "4. Check logcat: \`adb logcat | grep 'event-based'\`" >> $GITHUB_STEP_SUMMARY
          echo "5. Expected: Continuous uploads every 5-10s" >> $GITHUB_STEP_SUMMARY

      - name: Create Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: apps/public_web/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
